[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unspill"
version = "0.4.0"
description = "An append-only recovery timeline for Git workspaces"
authors = [{name = "Robert Al-Malak"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
unspill = "unspill.cli:main"

[project.urls]
Repository = "https://github.com/Qwin/Unspill"
Issues = "https://github.com/Qwin/Unspill/issues"

[tool.setuptools]
packages = ["unspill"]
