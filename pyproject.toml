[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgit"
version = "0.1.0"
description = "An append-only recovery timeline for Git workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]

[project.scripts]
bgit = "bgit.cli:main"

[tool.setuptools]
packages = ["bgit"]
