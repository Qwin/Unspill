[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgit"
version = "0.2.0"
description = "An append-only recovery timeline for Git workspaces"
authors = [{name = "Robert Al-Malak"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
bgit = "bgit.cli:main"

[project.urls]
Repository = "https://github.com/Qwin/BGit"
Issues = "https://github.com/Qwin/BGit/issues"

[tool.setuptools]
packages = ["bgit"]
