name: Build standalone downloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.22.0
      - name: Run source tests
        run: python -m unittest discover -v
      - name: Build and test native executable
        run: python scripts/build_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: unspill-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
